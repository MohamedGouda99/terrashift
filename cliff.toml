# git-cliff configuration — Conventional Commits → release notes.
#
# Pattern: stakpak_arch.md §35 (cliff.toml).
# Source: refs/stakpak/cliff.toml (template) — adapted for Terrashift's
# `feat(p-NN):` / `fix(p-NN):` / `docs(plan):` scope conventions
# (per CLAUDE.md "Conventional Commits with p-NN scope").

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}\
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# Conventional-commit prefix → changelog group. Order matters; first match wins.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs\\(plan\\)", group = "Plan / SESSION_PLAN" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(env\\)", group = "Environment" },
  { message = "^chore\\(refs\\)", group = "Reference codebases" },
  { message = "^chore", group = "Chores" },
  { message = "^ci", group = "CI" },
  # Skip release-bump commits + WIPs.
  { message = "^chore: bump", skip = true },
  { message = "^wip", skip = true },
]

# Filter out commits already published in a prior tag.
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
