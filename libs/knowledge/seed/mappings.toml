# Terrashift curated cross-cloud mapping bundle.
#
# Data, not code. Article XIII rule 8 — resource type names are
# enumerated here as KNOWLEDGE (the same way seed/<provider>/<version>/
# schema.json captures each provider's resource catalog) and consumed by
# the Mapper as a strong prior in its prompt under "PROVEN EQUIVALENCES".
#
# Coverage: ~30 canonical pairs per direction across the 6 cross-cloud
# directions (aws ↔ azurerm ↔ google). Confidence values follow:
#   1.00 — exact semantic equivalent, drop-in
#   0.90 — strong equivalent, near-identical role
#   0.80 — closest fit, may need post-migration adjustment
#   0.70 — workload-specific match; reviewer should sanity-check
# Anything below 0.70 is excluded — the LLM is better off proposing
# from scratch than being primed with a weak prior.
#
# attribute_alignments lists [source_attr, target_attr] pairs that are
# semantically equivalent. Used by the Mapper to hint attribute names
# to the model when emitting target HCL.

