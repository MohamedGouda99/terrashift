# CI pipeline — fmt + clippy + test on every PR.
# Pattern: stakpak_arch.md section 32 (CI matrix).
# Constitution: Article VII (repository hygiene), Article XIII rule 3 (deny lints).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: cargo clippy --all-targets -- -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # RFC schema-source-migration §5.4 Job A — eval schema cache integrity.
  # Recomputes SHA-256 of every entry in terrashift-evals/.schema-cache/,
  # compares with the manifest. Runs before the eval suite so a corrupt
  # schema cache surfaces as a verify failure rather than a confusing
  # downstream eval error.
  verify-eval-schemas:
    name: verify-eval-schemas (RFC §5.4 Job A)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: SHA-256 audit of eval schema cache
        run: cargo xtask verify-eval-schemas

  # Article XII rule 4 — token cost regression gate.
  # P-12 (libs/eval) shipped in commit 311b12c, R6 (commit <hash>) added
  # the active baseline + regression gate. Stage 1 baseline is all-zero
  # (no LLM calls fire); S4-close updates the baseline with real Mapper
  # token costs and CI flips the gate from Lenient to Strict.
  #
  # The `baseline_test` integration test inside the suite IS the gate:
  # `us3_running_suite_against_stage1_baseline_passes` runs the full
  # 13-golden suite + loads `terrashift-evals/eval-baseline.json` +
  # asserts `compare_against_baseline(report, baseline, Lenient).verdict
  # == Pass`. CI fails when that test fails — i.e., when token cost
  # regresses >30% against the committed baseline.
  eval:
    name: eval (golden suite + Article XII rule 4 regression gate)
    needs: verify-eval-schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run eval suite (includes baseline regression gate)
        run: cargo test --package terrashift-eval --release
