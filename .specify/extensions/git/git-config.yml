# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] Initial commit"

# Auto-commit AFTER core commands. Enabled to keep a per-step audit trail
# (matches Constitution Principle X — observability — and makes /speckit-analyze
# meaningful by showing each step as a discrete commit).
#
# BEFORE-* commits are off — they create noise. We commit AFTER each step so
# reviewers can see the progression: spec → clarification → plan → tasks → impl.
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "[Spec Kit] Save progress before clarification"
  before_plan:
    enabled: false
    message: "[Spec Kit] Save progress before planning"
  before_tasks:
    enabled: false
    message: "[Spec Kit] Save progress before task generation"
  before_implement:
    enabled: false
    message: "[Spec Kit] Save progress before implementation"
  before_checklist:
    enabled: false
    message: "[Spec Kit] Save progress before checklist"
  before_analyze:
    enabled: false
    message: "[Spec Kit] Save progress before analysis"
  before_taskstoissues:
    enabled: false
    message: "[Spec Kit] Save progress before issue sync"
  after_constitution:
    enabled: true
    message: "chore(constitution): update from Spec Kit"
  after_specify:
    enabled: true
    message: "feat(spec): add specification"
  after_clarify:
    enabled: true
    message: "docs(spec): resolve clarifications"
  after_plan:
    enabled: true
    message: "feat(plan): add implementation plan"
  after_tasks:
    enabled: true
    message: "feat(tasks): generate dependency-ordered tasks"
  after_implement:
    enabled: true
    message: "feat(impl): implementation progress (per Constitution Principle VII)"
  after_checklist:
    enabled: true
    message: "docs(checklist): add acceptance checklist"
  after_analyze:
    enabled: true
    message: "docs(analysis): cross-artifact consistency report"
  after_taskstoissues:
    enabled: false
    message: "[Spec Kit] Sync tasks to issues"
